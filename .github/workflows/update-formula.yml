name: Update formulae

on:
  schedule:
    # 08:00 Asia/Shanghai, after a release published overnight is available.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update formulae from their latest releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-formula.py

      - name: Commit and push when formulae changed
        run: |
          if git diff --quiet -- Formula/; then
            echo "No formula change."
            exit 0
          fi
          summary=""
          for file in $(git diff --name-only -- Formula/); do
            name="$(basename "$file" .rb)"
            version="$(sed -n 's/.*releases\/download\/v\([^/]*\)\/.*/\1/p' "$file" | head -n 1)"
            summary="${summary}${name} ${version}, "
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/
          git commit -m "Update formulae: ${summary%, }"
          git push
