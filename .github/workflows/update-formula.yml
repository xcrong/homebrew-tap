name: Update formula

on:
  schedule:
    # 08:00 Asia/Shanghai, after a release published overnight is available.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update formula from the latest brewup release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-formula.py

      - name: Commit and push when the formula changed
        run: |
          if git diff --quiet -- Formula/brewup.rb; then
            echo "No formula change."
            exit 0
          fi
          version="$(sed -n 's/.*releases\/download\/v\([^/]*\)\/.*/\1/p' Formula/brewup.rb | head -n 1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/brewup.rb
          git commit -m "Update brewup to ${version}"
          git push
